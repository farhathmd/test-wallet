# Runs PostgreSQL + the wallet API + the dashboard.
#   JWT_SECRET="$(openssl rand -hex 32)" docker compose up -d --build
# dashboard -> http://localhost:5173   API -> http://localhost:4000/api/v1/health
# The database is published on 5433, not 5432, so a Homebrew/local PostgreSQL on the host can keep
# running (the API reaches the container as `db:5432` over the compose network either way).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - wallet-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgres://wallet:wallet@db:5432/wallet
      # Override in production: JWT_SECRET="$(openssl rand -hex 32)" docker compose up
      JWT_SECRET: ${JWT_SECRET:-change-me-this-is-only-a-local-development-secret}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      DB_POOL_MAX: '10'
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:4000/api/v1/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./react
      args:
        # Baked into the bundle: the browser must be able to reach the API from the host machine.
        VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - '5173:80'
    depends_on:
      api:
        # The dashboard itself is static, but waiting for the API's health check means the first
        # browser request after `up -d` never lands before the API can answer it.
        condition: service_healthy

volumes:
  wallet-db:
