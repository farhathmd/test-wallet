# Runs PostgreSQL + the wallet API + the dashboard.
#   cp .env.example .env && docker compose up -d --build --wait
# dashboard -> http://localhost:5173   API -> http://localhost:4000/api/v1/health
# The database is published on 5433, not 5432, so a Homebrew/local PostgreSQL on the host can keep
# running (the API reaches the container as `db:5432` over the compose network either way).
# `name` keeps container and image names stable ("wallet-api-1", "wallet-api") no matter what the
# checkout directory is called.
name: wallet
services:
  db:
    image: postgres:16-alpine
    # `unless-stopped` is what makes this a deployment rather than a demo: the containers come back
    # after a reboot or a crash without resurrecting ones you deliberately stopped.
    restart: unless-stopped
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}"
      POSTGRES_DB: wallet
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - wallet-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wallet -d wallet']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: "postgres://wallet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/wallet"
      # No fallback on the three secrets: booting with a public default means forgeable tokens and a
      # known admin password, which is worse than failing to start.
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required — see .env.example}"
      JWT_EXPIRES_IN: 7d
      # The dashboard's public origin(s); the default lists both local spellings of the compose port
      # below, because a browser treats http://localhost:5173 and http://127.0.0.1:5173 as different
      # origins and whichever is missing is refused with "blocked by CORS policy".
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD is required — see .env.example}"
      DB_POOL_MAX: '10'
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:4000/api/v1/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    restart: unless-stopped
    build:
      context: ./react
      args:
        # Baked into the bundle: the browser must be able to reach the API from the host machine.
        VITE_API_URL: "${VITE_API_URL:-http://localhost:4000/api/v1}"
    ports:
      - '5173:80'
    healthcheck:
      # busybox wget from the alpine base: this proves nginx is answering requests, not just that the
      # container started, which is what makes `--wait` meaningful for this service too.
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        # The dashboard itself is static, but waiting for the API's health check means the first
        # browser request after `up -d` never lands before the API can answer it.
        condition: service_healthy

volumes:
  wallet-db:
