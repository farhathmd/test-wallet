# Static hosting for the dashboard.
# The try_files fallback is what makes client-side routing work: /login must return index.html instead
# of a 404 when the page is opened or refreshed directly.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed asset filenames can be cached forever; index.html must not be.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
